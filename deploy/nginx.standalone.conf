#  HISENSE LingxiBI — nginx configuration for a standalone (non-Docker) deployment.
#
#  Serves the built SPA from html/dist and reverse-proxies /api/ to the Rust
#  server on 127.0.0.1:3001.
#
#  Apply:  nginx -t        (check syntax)
#          nginx -s reload (apply)

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # WebSocket support. `Connection` must be "upgrade" only for requests that
    # actually ask to upgrade; sending it unconditionally breaks plain requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Report iframes and embeds authenticate with a token in the query string
    # (?token=...). Logging $uri instead of $request_uri keeps those tokens out
    # of the access log. Tradeoff: other query parameters aren't logged either.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" ${request_time}s';
    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        root  html/dist;
        index index.html;

        # AI-generated dashboard HTML is saved through the API and regularly
        # exceeds nginx's 1 MB default, which would fail with 413. Matches the
        # server's own 10 MB body limit with headroom.
        client_max_body_size 12m;

        # ── API + WebSocket ──
        location /api/ {
            proxy_pass http://127.0.0.1:3001;

            # Required for the /api/chat WebSocket: nginx proxies with HTTP/1.0
            # by default, which cannot carry an Upgrade handshake.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Several endpoints wait synchronously on the LLM (report Q&A, AI
            # summary, AI metric generation, alert templates). Full dashboard
            # generation has been measured at ~90s, so nginx's 60s default cuts
            # these off with a 504 while the server is still working normally.
            proxy_connect_timeout 30s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            # No X-Frame-Options here on purpose: report HTML is served from
            # /api/reports/{id}/html and is meant to be embeddable. The server
            # sends its own security headers (including a sandbox CSP on report
            # HTML), so adding them here would only duplicate them.
        }

        # ── Static assets (content-hashed filenames, safe to cache hard) ──
        # `expires` is used rather than add_header so the headers below are
        # still inherited (nginx drops inherited add_header when a level
        # defines its own).
        location /assets/ {
            expires 365d;
            access_log off;
        }

        # ── SPA ──
        location / {
            try_files $uri $uri/ /index.html;

            # Applied to the app shell only. SAMEORIGIN protects the admin UI
            # from being framed by another site; it deliberately does not cover
            # /api/, so report embedding keeps working.
            add_header X-Frame-Options       SAMEORIGIN;
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy       strict-origin-when-cross-origin;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

    # ── HTTPS ──
    # Strongly recommended before exposing this publicly: report iframes and
    # embeds pass tokens in the URL, and the GitHub OAuth flow returns a token
    # in the redirect. Over plain HTTP those are visible to anything on the
    # path, and the OAuth state cookie cannot be marked Secure.
    #
    # server {
    #     listen              443 ssl;
    #     http2               on;
    #     server_name         your.domain.com;
    #
    #     ssl_certificate     cert.pem;
    #     ssl_certificate_key cert.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     # Copy the root / client_max_body_size / location blocks from above.
    # }
    #
    # server {
    #     listen      80;
    #     server_name your.domain.com;
    #     return 301  https://$host$request_uri;
    # }
}
